schema_version = "1.1"

[task]
name = "codimango/already-served-item-set-recovery-pivot"
description = "Recover a non-canonical served-item bitmap, add a compatible writer, then pivot iteration and audit to true streaming."
authors = [{ name = "Jack Chen", email = "hcjackchen@meta.com" }]
keywords = ["served-items", "bitmap", "codec", "roundtrip", "streaming", "audit"]

[metadata]
author_name = "Jack Chen"
author_email = "hcjackchen@meta.com"
difficulty = "hard"
category = "recsys"
reward_type = "binary"
tags = ["multi-turn", "context-following", "context-overriding"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false
mcp_servers = []

[environment.env]
[solution.env]

[[steps]]
name = "1_recover_reader"
dependencies = []
