schema_version = "1.1"

[task]
name = "codimango/byte-match-non-greedy-rle-bitpack-pivot"
description = "Build a decodable hybrid integer page, recover the legacy byte-exact non-greedy dialect, then pivot to dictionary-only bit packing."
authors = [{ name = "Jack Chen", email = "hcjackchen@meta.com" }]
keywords = ["database-internals", "rle", "bitpack", "dictionary", "multi-turn"]

[metadata]
author_name = "Jack Chen"
author_email = "hcjackchen@meta.com"
difficulty = "hard"
category = "iterate_on_feature"
reward_type = "binary"
tags = ["multi-turn", "context-following", "context-overriding"]

