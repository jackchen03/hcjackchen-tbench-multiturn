schema_version = "1.1"

[task]
name = "codimango/order-by-order-reimpl-pivot"
description = "Recover an opaque order-by-order book dialect, instrument its quirks, then pivot the carried implementation to canonical semantics."
authors = [{ name = "Jack Chen", email = "hcjackchen@meta.com" }]
keywords = ["order", "book", "reimplementation", "quirks", "canonical", "pivot"]

[metadata]
author_name = "Jack Chen"
author_email = "hcjackchen@meta.com"
difficulty = "hard"
category = "trading-infra"
reward_type = "binary"
tags = ["multi-turn", "context-following", "context-overriding"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false
mcp_servers = []

[environment.env]
[solution.env]

[[steps]]
name = "1_reimplement_book"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 1800.0

[steps.agent]
timeout_sec = 1800.0

[[steps]]
name = "2_instrument_quirks"
dependencies = ["1_reimplement_book"]
inherit_prior_session = true
min_reward = 1.0

[steps.verifier]
timeout_sec = 1800.0

[steps.agent]
timeout_sec = 1800.0

[[steps]]
name = "3_pivot_to_canonical"
dependencies = ["2_instrument_quirks"]
inherit_prior_session = true
min_reward = 1.0

[steps.verifier]
timeout_sec = 1800.0

[steps.agent]
timeout_sec = 1800.0
