schema_version = "1.1"

[task]
name = "filesystem-internals/vfat-anti-canonical-reimpl-pivot"
description = "Byte-for-byte reimplementation of anti-canonical VFAT directory-entry generator with quirky dialect (global tail, always-LFN, extra slot at %13==0), then listing/recovery relying on exact format, then overriding pivot to canonical representation and different cluster-chain format dropping prior quirks."
authors = []

[metadata]
difficulty = "hard"
category = "iterate_on_feature"
tags = ["multi-turn", "context-following", "context-overriding"]

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false

[[steps]]
name = "1_byte-exact-vfatdir-reimpl"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0

[[steps]]
name = "2_listing-recovery"
dependencies = ["1_byte-exact-vfatdir-reimpl"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0

[[steps]]
name = "3_pivot-canonical-representation"
dependencies = ["2_listing-recovery"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0
