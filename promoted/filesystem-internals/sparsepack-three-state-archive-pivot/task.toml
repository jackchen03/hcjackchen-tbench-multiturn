schema_version = "1.1"

[task]
name = "filesystem-internals/sparsepack-three-state-archive-pivot"
description = "Reimplement opaque sparsepack three-state archive byte-for-byte via 3-step reverse-engineering: basic SPK1 layout with hole/written and written-only rolling CRC, then unwritten type trichotomy and written-zeros, then physical-tree segmentation that forbids merging across extent leaf boundaries on >340-extent two-level trees."
