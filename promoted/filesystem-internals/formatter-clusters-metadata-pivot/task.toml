schema_version = "1.1"

[task]
name = "filesystem-internals/formatter-clusters-metadata-pivot"
description = "Reimplement byte-exact myfs-mkfs formatter with flex-clustered metadata dialect: baseline STRIDE=1 clustering plus fixed constants, then STRIDE>1 stride round-up and pad-as-used accounting, then pivot to modulo bump (F mod STRIDE) for inode-table and full generalization."
authors = []

[metadata]
difficulty = "hard"
category = "iterate_on_feature"
tags = ["multi-turn", "context-following", "context-overriding"]

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false

[[steps]]
name = "1_baseline-stride1-clustering"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0

[[steps]]
name = "2_stride-pad-accounting"
dependencies = ["1_baseline-stride1-clustering"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0

[[steps]]
name = "3_modulo-bump-pivot"
dependencies = ["2_stride-pad-accounting"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0
